name: CI

on:
  pull_request:
  push:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
      - name: Install package
        shell: bash -l {0}
        run: |
          pip install -e .
      - name: Run smoke test
        shell: bash -l {0}
        run: |
          python scripts/smoke_test.py
