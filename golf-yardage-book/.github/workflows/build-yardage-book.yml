name: Build Yardage Book

on:
  workflow_dispatch:
    inputs:
      place:
        description: "Place name to geocode (preferred)"
        required: false
        type: string
      course:
        description: "Course name for the cover"
        required: true
        type: string
        default: "Yardage Book"
      paper:
        description: "Paper size (pocket, legal, letter)"
        required: false
        type: choice
        default: pocket
        options:
          - pocket
          - legal
          - letter
      tee_set:
        description: "Tee set (back, middle, front)"
        required: false
        type: choice
        default: back
        options:
          - back
          - middle
          - front
      tee_label:
        description: "Tee label substring (optional)"
        required: false
        type: string
      tee_index:
        description: "Tee index (1-based, optional)"
        required: false
        type: string
      buffer_m:
        description: "Buffer distance in meters around place polygon (optional)"
        required: false
        type: string
      lat:
        description: "Latitude (fallback)"
        required: false
        type: string
      lon:
        description: "Longitude (fallback)"
        required: false
        type: string
      radius:
        description: "Radius in meters (fallback)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golf-yardage-book
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build yardage book
        env:
          PLACE: ${{ inputs.place }}
          COURSE: ${{ inputs.course }}
          PAPER: ${{ inputs.paper }}
          TEE_SET: ${{ inputs.tee_set }}
          TEE_LABEL: ${{ inputs.tee_label }}
          TEE_INDEX: ${{ inputs.tee_index }}
          BUFFER_M: ${{ inputs.buffer_m }}
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          RADIUS: ${{ inputs.radius }}
          OUTPUT: outputs/book.pdf
        run: |
          ./scripts/build_yardage_book.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: yardage-book
          path: golf-yardage-book/outputs/book.pdf
